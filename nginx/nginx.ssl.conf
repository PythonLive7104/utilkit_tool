# HTTPS config — activated automatically by deploy.sh after SSL cert is obtained.
# Edit BOTH server_name lines below to match your domain before running deploy.sh.

server {
    listen 80;
    server_name utilkit.us www.utilkit.us;

    # Certbot renewal (keep even after switch to HTTPS)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP → HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name utilkit.us www.utilkit.us;

    ssl_certificate     /etc/letsencrypt/live/utilkit.us/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/utilkit.us/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25M;

    # Docker's embedded DNS. Required so the proxy_pass blocks below re-resolve
    # the "backend" hostname instead of caching its IP at startup — otherwise
    # nginx keeps hitting the old container IP after a backend rebuild → 502.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Serve React SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded ad banners (shared volume with the backend)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Proxy Django API
    location /api/ {
        # Variable forces nginx to use the resolver above at request time
        # (a literal host here would be resolved once and cached).
        set $backend "backend:8000";
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Short-link redirects
    location /s/ {
        set $backend "backend:8000";
        proxy_pass         http://$backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
