<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Free PDF converter, image compressor, AI writing tools, QR code generator, password generator, and 62 more utilities. All browser-based, all free, no account needed." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <link rel="stylesheet" media="print" onload="this.media='all'" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" /></noscript>
    <title>UtilKit — Free Online Utility Tools</title>
    <meta name="robots" content="index, follow" />
    <meta name="google-site-verification" content="b8DvNOU5ggKThtBz-p4AS79DiWMEljMfMpaX9K65LVA" />

    <!-- Static structured data: Google reads this before executing JavaScript -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "UtilKit",
      "url": "https://utilkit.us",
      "description": "68 free online tools — PDF conversion, image editing, AI writing tools, calculators, developer utilities, and text processing. No sign-up required.",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://utilkit.us/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "UtilKit",
      "url": "https://utilkit.us",
      "logo": "https://utilkit.us/og-image.png",
      "description": "Free online utility tools — PDF, image, AI, developer, and text tools. All browser-based, all free, no account needed."
    }
    </script>

  </head>
  <body>
    <div id="root"></div>

    <!-- Pre-React splash. The prerendered SEO HTML lives inside #root for
         crawlers, but for human visitors it's a simplified static snapshot that
         React discards on mount (createRoot, not hydrate). This branded overlay
         covers that swap so it reads as a clean load instead of a page flash.
         App removes it on mount; the timeout is a safety net if JS fails. -->
    <div id="app-splash" aria-hidden="true" style="position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;background:#09090b;">
      <div style="display:flex;align-items:center;gap:10px;color:#fff;font-family:Inter,system-ui,sans-serif;font-weight:700;font-size:20px;">
        <span style="width:22px;height:22px;border:3px solid rgba(99,102,241,.3);border-top-color:#6366f1;border-radius:50%;display:inline-block;animation:utilkit-spin .7s linear infinite;"></span>
        UtilKit
      </div>
    </div>
    <style>@keyframes utilkit-spin{to{transform:rotate(360deg)}}</style>
    <script>setTimeout(function(){var s=document.getElementById('app-splash');if(s)s.style.display='none'},8000)</script>

    <script type="module" src="/src/main.jsx"></script>

    <!-- Third-party scripts loaded after page to avoid blocking the tab spinner -->
    <script>
      window.addEventListener('load', function () {
        var adsense = document.createElement('script')
        adsense.async = true
        adsense.src = 'https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743047876807902'
        adsense.crossOrigin = 'anonymous'
        document.body.appendChild(adsense)
      })
    </script>
  </body>
</html>
