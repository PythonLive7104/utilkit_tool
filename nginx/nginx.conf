# HTTP-only config — used during initial setup to obtain the SSL certificate.
# After running deploy.sh, this file is replaced with nginx.ssl.conf automatically.

server {
    listen 80;
    server_name _;

    # Certbot ACME challenge — must be reachable over HTTP
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve React SPA
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Uploaded ad banners (shared volume with the backend)
    location /media/ {
        alias /var/www/media/;
        expires 7d;
        access_log off;
    }

    # Proxy Django API
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        client_max_body_size 25M;
    }

    # Short-link redirects
    location /s/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
